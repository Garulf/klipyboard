[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klipyboard"
authors = [
    {name = "Garulf"}
]
version = "0.3.2" # x-release-please-version
description = "Search and copy Klipy GIF URLs from Flow Launcher"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "pyflowlauncher>=1.2.1",
    "httpx",
]

[project.urls]
Repository = "https://github.com/Garulf/klipyboard"

[tool.hatch.build.targets.wheel]
packages = ["src/klipyboard"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-httpx",
    "flake8",
    "mypy",
    "tox",
    "tox-uv",
    "pre-commit",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
