[tox]
package_name = "src/klipyboard"
envlist = lint, type, py312

[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-httpx
commands =
    pytest {posargs:tests}

[testenv:lint]
description = Run all linting checks
skip_install = false
deps = flake8
commands = flake8 {[tox]package_name} tests

[testenv:type]
description = Run all type checks
skip_install = false
deps = mypy
commands = mypy {[tox]package_name}
